<!DOCTYPE html>
<html lang="fa" dir="auto">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>خوش آمدید!</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="(hover: none) and (pointer: coarse)">
    <script>
        if (localStorage.getItem("cache-g") != "welcome") {
            window.location.href = 'main.html';
        }
    </script>
</head>

<body>
    <img src="icon.png">
    <p>________________________</p>
    <h1>خوش آمدید به بازی کلمه 5 حرف حدس زن!</h1>
    <p>سازنده: کوروش فتح آبادی</p>
    <h1 style="display: inline;">©</h1>
    <p style="display: inline-block; transform: translateY(-20%);" lang="en" dir="auto">All rights reserved</p>
    <p>________________________</p>
    <button onclick="main()">صفحه ی اصلی</button>
    <br><br>
    <script>
        function main() {
            if (localStorage.getItem("money-g") == null) {
                localStorage.setItem("money-g", 2);
            }
            if (localStorage.getItem("words-g") == null) {
                localStorage.setItem("words-g", 0);
            }
            if (localStorage.getItem("startHour-g") == null) {
                localStorage.setItem("startHour-g", new Date().getHours());
            }
            if (localStorage.getItem("day-g") == null) {
                localStorage.setItem("day-g", new Date().getDay());
            }
            window.location.href = 'main.html';
        }
    </script>
</body>

</html>
