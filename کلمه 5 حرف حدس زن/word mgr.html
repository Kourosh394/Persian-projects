<head>
    <meta charset="UTF-8">
    <title>مدیر کلمات داخلی</title>
    <link rel="icon" href="html icons/word mgr.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="(hover: none) and (pointer: coarse)">
    <style>
        div {
            user-select: none;
            border-radius: 20px;
        }

        div p {
            margin: 0px;
        }

        .wordsAndFolders {
            display: inline-block;
            border-radius: 0px;
            margin: 1%;
        }

        .setName {
            display: none;
            position: fixed;
            top: 1%;
            right: 1%;
        }

        #contents {
            width: 99%;
            height: 50vh;
            border: 5px solid black;
            user-select: none;
            margin: auto;
            overflow-x: auto;
        }
    </style>
    <script src="kernel.js"></script>
    <script>
        checkLScacheG("WordMGR");
    </script>
</head>

<body>
    <h1 id="folderName" dir="auto"></h1>
    <img src="html icons/word mgr.png" style="position: fixed; top: 1%; left: 1%;">
    <div style="width: 99%; max-height: 20vh; overflow-x: auto; border: 5px solid black; margin: auto;">
        <div id="control"></div>
        <input dir="auto" placeholder="کلمه ی جدید" id="newWord">
        <button onclick="newWord()">ثبت</button>
        <input dir="auto" placeholder="پوشه ی جدید" id="newfolder">
        <button onclick="newFolder()">ثبت</button>
        <button onclick="paste('pasteButton')" id="pasteButton">جایگذاری</button>
        <button onclick="deselectAll(); document.getElementById('control').innerHTML = ''">در آوردن از انتخاب</button>
        <button onclick="CRWTP()">انتخاب رندوم</button>
        <button onclick="openFolder('lastFolder')">پوشه ی قبلی</button>
        <button onclick="window.location.href = 'main.html'">برگشت</button>
    </div>
    <p id="alert" style="color: red; margin: 0.5%;"></p>
    <div id="contents">
    </div>
    <script>
        moneyG();
        music();
        const control = document.getElementById("control");
        const alertp = document.getElementById("alert");
        let locationFolder = "/";
        let folderWords;
        let folders;
        let clipBoard;
        view();
        function view() {
            const contents = document.getElementById("contents");
            RLSSV();
            folders = localStorages.filter(folder => folder.startsWith("Word location:" + locationFolder) && folder.length > 17).map(folder => folder.slice(14 + locationFolder.length, -3)).filter(folder => folder.split("/").length < 3 && folder.length > 0);
            deselectAll();
            control.innerHTML = "";
            contents.innerHTML = "";
            if (locationFolder != "/کلمات پیش فرض/") {
                folderWords = localStorage.getItem(`Word location:${locationFolder} -g`).split("\n").filter(word => word.length > 0).sort();
            } else {
                folderWords = ["سلامت", "لوستر", "مرجان", "مهتاب", "ناخدا", "نیسان", "وگرنه", "پرنده", "پرواز", "پیشرو", "کوروش", "کوییک"];
            }
            let counter = 0;
            while (counter < folderWords.length) {
                let wordDiv = Object.assign(document.createElement("div"), {
                    className: "wordsAndFolders",
                    dir: "auto"
                });
                const thisWord = folderWords[counter];
                let onclickEditControl = `
                <button onclick="copy()">کپی</button>
                <button onclick="folderWords.splice(${counter}, 1); saveWords()">حذف</button>
                <input dir="auto" placeholder="ویرایش" id="editWord">
                <button onclick="let word = document.getElementById('editWord').value; if (checkWord(word, 'editWord')) {folderWords[${counter}] = word; view()}">ثبت</button>
                <button onclick="localStorage.setItem('cache-g', '${thisWord}'); window.location.href = 'game.html'">باز کردن</button>
                `;
                wordDiv.onclick = function () {
                    deselectAll();
                    wordDiv.style.backgroundColor = "rgb(0, 100, 255)";
                    if (locationFolder == "/کلمات پیش فرض/") {
                        onclickEditControl = `
                        <button onclick="copy()">کپی</button>
                        <button onclick="localStorage.setItem('cache-g', '${thisWord}'); window.location.href = 'game.html'">باز کردن</button>
                        `;
                    }
                    control.innerHTML = onclickEditControl;
                };
                wordDiv.ondblclick = function () {
                    localStorage.setItem("cache-g", thisWord);
                    window.location.href = "game.html";
                };
                hold(wordDiv, function () {
                    localStorage.setItem("cache-g", thisWord);
                    window.location.href = "game.html";
                });
                contents.appendChild(wordDiv);
                wordDiv.appendChild(Object.assign(document.createElement("img"), { src: "word mgr/word.png" }));
                wordDiv.appendChild(Object.assign(document.createElement("p"), { innerHTML: thisWord }));
                counter++;
            }
            counter = 0;
            while (counter < folders.length) {
                let folderDiv = Object.assign(document.createElement("div"), {
                    className: "wordsAndFolders",
                    dir: "auto"
                });
                const thisFolder = folders[counter].replaceAll("'", "\\'");
                const folderItems = localStorage.getItem(`Word location:${locationFolder + thisFolder} -g`).split("\n");
                const onclickEditControl = `
                <button onclick="copy()">کپی</button>
                <button onclick="localStorages.filter(LSF => LSF.startsWith('Word location:' + '${locationFolder + thisFolder}')).map(LSF => localStorage.removeItem(LSF)); view()">حذف</button>
                <input dir="auto" placeholder="ویرایش" id="editFolderName">
                <button onclick="renameFolder(document.getElementById('editFolderName').value, '${thisFolder}', 'editFolderName')">ثبت</button>
                <button onclick="openFolder('${thisFolder}')">باز کردن</button>
                `;
                folderDiv.onclick = function () {
                    deselectAll();
                    folderDiv.style.backgroundColor = "rgb(0, 100, 255)";
                    control.innerHTML = onclickEditControl;
                };
                folderDiv.ondblclick = function () {
                    control.innerHTML = "";
                    openFolder(thisFolder);
                };
                hold(folderDiv, function () {
                    control.innerHTML = "";
                    openFolder(thisFolder);
                });
                contents.appendChild(folderDiv);
                if (localStorage.getItem(`Word location:${locationFolder + thisFolder} -g`) == "" && localStorages.filter(LSF => LSF.startsWith(`Word location:${locationFolder + thisFolder}`)).length == 1) {
                    folderDiv.appendChild(Object.assign(document.createElement("img"), { src: "word mgr/empty folder.png" }));
                } else {
                    folderDiv.appendChild(Object.assign(document.createElement("img"), { src: "word mgr/full folder.png" }));
                }
                folderDiv.appendChild(Object.assign(document.createElement("p"), { innerHTML: thisFolder.slice(0, thisFolder.length - 1).replaceAll("\\'", "'") }));
                counter++;
            }
            if (locationFolder == "/") {
                let folderKPF = Object.assign(document.createElement("div"), {
                    className: "wordsAndFolders",
                    dir: "auto"
                });
                folderKPF.onclick = function () {
                    deselectAll();
                    folderKPF.style.backgroundColor = "rgb(0, 100, 255)";
                    control.innerHTML = `<button onclick="openFolder('KPF')">باز کردن</button>`;
                };
                folderKPF.ondblclick = function () {
                    openFolder("KPF");
                };
                hold(folderKPF, function () {
                    openFolder("KPF");
                });
                folderKPF.appendChild(Object.assign(document.createElement("img"), { src: "word mgr/lock folder.png" }));
                folderKPF.appendChild(Object.assign(document.createElement("p"), { innerHTML: "کلمات پیش فرض" }));
                contents.appendChild(folderKPF);
            }
            if (contents.innerHTML == "") {
                contents.innerHTML = "<p>خالی است!</p>"
            }
            document.getElementById("folderName").innerText = locationFolder;
        }
        function saveWords() {
            localStorage.setItem(`Word location:${locationFolder} -g`, folderWords.join("\n"));
            view();
        }
        function newWord() {
            let word = document.getElementById("newWord").value;
            if (checkWord(word, "newWord")) {
                folderWords.push(document.getElementById("newWord").value);
                saveWords();
                view();
            }
        }
        function newFolder() {
            const folder = document.getElementById("newfolder").value;
            if (checkFolderName(folder, "newfolder")) {
                localStorage.setItem(`Word location:${locationFolder + folder}/ -g`, "");
                view();
            }
        }
        function checkWord(word, SID) {
            if (word.length == 5 && word.includes("-") == false && folderWords.includes(word) == false && locationFolder != "/کلمات پیش فرض/") {
                alertp.innerText = "";
                return true;
            } else {
                CWT(SID, "shake");
                CWT("alert", "SBE");
                if (word.length != 5) {
                    alertp.innerText = "کلمه 5 حرفی نیست.";
                } else if (word.includes("-")) {
                    alertp.innerText = 'کلمه "-" دارد.';
                } else if (folderWords.includes(word)) {
                    alertp.innerText = "کلمه اینجا با این نام هست.";
                } else {
                    alertp.innerText = "پوشه قفل است.";
                }
                return false;
            }
        }
        function checkFolderName(folder, SID) {
            if (folder.includes("/") == false && folders.includes(folder + "/") == false && folder.includes('"') == false && folder.length != 0 && localStorages.filter(folderName => folderName.startsWith("Word location:" + locationFolder)).join("/").replaceAll("Word location:", "").replaceAll(" -g", "").includes(folder) == false && locationFolder != "/کلمات پیش فرض/") {
                alertp.innerText = "";
                return true;
            } else {
                CWT(SID, "shake");
                CWT("alert", "SBE");
                if (folder.includes("/")) {
                    alertp.innerText = 'پوشه "/" دارد.';
                } else if (folders.includes(folder + "/")) {
                    alertp.innerText = "پوشه اینجا با این نام هست.";
                } else if (folder.includes('"')) {
                    alertp.innerText = 'پوشه " دارد.';
                } else if (folder.length == 0) {
                    alertp.innerText = "نام خالی است!";
                } else if (localStorages.filter(folderName => folderName.startsWith("Word location:" + locationFolder)).join("/").replaceAll("Word location:", "").replaceAll(" -g", "").includes(folder)) {
                    alertp.innerText = "نباید نام پوشه در زیر پوشه باشد.";
                } else {
                    alertp.innerText = "پوشه قفل است.";
                }
                return false;
            }
        }
        function openFolder(folder) {
            if (folder.includes("/")) {
                locationFolder = locationFolder + folder;
            } else if (folder == "lastFolder") {
                const PFB = locationFolder.split("/");
                locationFolder = PFB.slice(0, PFB.length - 2).join("/") + "/";
            } else if (folder == "KPF") {
                locationFolder = "/کلمات پیش فرض/";
            }
            if (locationFolder == "//") {
                locationFolder = "/";
            }
            view();
        }
        function renameFolder(NFN, folderName, SID) {
            if (checkFolderName(NFN, SID)) {
                const CNF = localStorages.filter(LSF => LSF.startsWith("Word location:" + locationFolder + folderName));
                let counter = 0;
                while (counter < CNF.length) {
                    const FNFE = CNF[counter];
                    localStorage.setItem(`Word location:${locationFolder + NFN}/${FNFE.split(folderName).pop()}`, localStorage.getItem(FNFE));
                    localStorage.removeItem(FNFE);
                    counter++;
                }
                view();
            }
        }
        function CRWTP() {
            const wordsNumber = folderWords.length;
            if (wordsNumber >= 2) {
                localStorage.setItem('cache-g', folderWords[random(wordsNumber - 1)]);
                window.location.href = "game.html";
            } else {
                CWT("alert", "SBE");
                document.getElementById("alertp").innerText = "در بازی باید بیشتر از 2 کلمه باشد تا شما بازی با انتخاب رندوم کنید.";
            }
        }
        function deselectAll() {
            document.querySelectorAll(".wordsAndFolders").forEach(function (wordOrFolder) {
                wordOrFolder.style.backgroundColor = "";
            });
        }
        function copy() {
            document.body.querySelectorAll("div").forEach(function (wordOrFolder) {
                if (wordOrFolder.style.backgroundColor == "rgb(0, 100, 255)") {
                    const itemName = wordOrFolder.querySelector("p").innerHTML;
                    if (wordOrFolder.querySelector("img").src.endsWith("folder.png") && wordOrFolder.querySelector("img").src.endsWith("word%20mgr/lock%20folder.png") == false) {
                        clipBoard = [];
                        localStorages.filter(LSF => LSF.startsWith("Word location:" + locationFolder + itemName + "/")).map(LSF => clipBoard.push((itemName + LSF.split(itemName).pop()).slice(0, (itemName + LSF.split(itemName).pop()).length - 3), localStorage.getItem(LSF)));
                    } else if (wordOrFolder.querySelector("img").src.endsWith("word%20mgr/word.png")) {
                        clipBoard = itemName;
                    } else {
                        CWT("alert", "SBE");
                        alertp.innerText = "پوشه قفل را نمیتوان کپی کرد.";
                    }
                }
            });
        }
        function paste(SID) {
            if (Array.isArray(clipBoard)) {
                if (checkFolderName(clipBoard[0].split("/")[0]) == false) { return; }
                let counter = 0;
                while (counter < clipBoard.length) {
                    localStorage.setItem(`Word location:${locationFolder + clipBoard[counter]} -g`, clipBoard[counter + 1]);
                    counter += 2;
                }
                view();
            } else if (clipBoard != undefined) {
                if (checkWord(clipBoard, SID)) {
                    folderWords.push(clipBoard);
                    saveWords();
                }
            } else {
                CWT("alert", "SBE");
                CWT(SID, "shake");
                alertp.innerText = "پوشه ای هنوز کپی نشده است.";
            }
        }
        document.addEventListener("keydown", function (keypushed) {
            const keydowned = keypushed.key;
            if (keydowned == "d" || keydowned == "D" || keydowned == "ی") {
                deselectAll();
                control.innerHTML = "";
            } else if (keydowned == "c" || keydowned == "C" || keydowned == "ز") {
                copy();
            } else if (keydowned == "v" || keydowned == "V" || keydowned == "ر") {
                paste();
            } else if (keydowned == "Enter") {
                document.body.querySelectorAll("div").forEach(function (wordOrFolder) {
                    if (wordOrFolder.style.backgroundColor == "rgb(0, 100, 255)") {
                        wordOrFolder.dispatchEvent(new MouseEvent("dblclick"));
                    }
                });
            }
        });
    </script>
</body>

</html>
