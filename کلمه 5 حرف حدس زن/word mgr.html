<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>مدیر کلمات داخلی</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="(hover: none) and (pointer: coarse)">
    <style>
        img {
            width: max-content;
        }

        div {
            border-radius: 20px;
        }

        div p {
            margin: 0px;
        }

        .wordsAndFolders {
            display: inline-block;
            margin: 1%;
            user-select: none;
        }

        .wordsAndFolders img {
            width: auto;
        }

        .setName {
            display: none;
            position: fixed;
            top: 1%;
            right: 1%;
        }

        #contents {
            width: 99%;
            height: 50vh;
            border: 5px solid black;
            margin: auto;
            overflow-x: auto;
        }
    </style>
    <script src="kernel.js"></script>
    <script>
        checkLScacheG("WordMGR");
    </script>
</head>

<body>
    <h1 id="folderName" dir="auto"></h1>
    <div style="width: 99%; max-height: 20vh; overflow-x: auto; border: 5px solid black; margin: auto;">
        <div id="control"></div>
        <input placeholder="کلمه ی جدید" id="newWord">
        <button onclick="newWord()">ثبت</button>
        <input placeholder="پوشه ی جدید" id="newfolder">
        <button onclick="newFolder()">ثبت</button>
        <button onclick="deselectAll(); document.getElementById('control').innerHTML = ''">در آوردن از انتخاب</button>
        <button onclick="CRWTP()">بازی با انتخاب رندوم</button>
        <button onclick="openFolder('lastFolder')">پوشه ی قبلی</button>
        <button onclick="window.location.href = 'main.html'">برگشت</button>
    </div>
    <p id="alert" style="color: red; margin: 0.5%;"></p>
    <div id="contents">
    </div>
    <script>
        moneyG();
        music();
        document.querySelectorAll("input").forEach(function (input) { input.dir = "auto" });
        let control = document.getElementById("control");
        let locationFolder = "/";
        let folderWords = localStorage.getItem(`Word location:${locationFolder} -g`).split("\n").filter(word => word.length > 0);
        let folders;
        view();
        function view() {
            let contents = document.getElementById("contents");
            RLSSV();
            folders = localStorages.filter(folder => folder.startsWith("Word location:" + locationFolder) && folder.length > 17).map(folder => folder.slice(14 + locationFolder.length, -3)).filter(folder => folder.split("/").length < 3 && folder.length > 0);
            if (locationFolder == "/کلمات پیش فرض/") {
                document.body.querySelector("div").style.display = "none";
                contents.innerHTML = `
                <button onclick="openFolder('lastFolder')">پوشه ی قبلی</button>
                <button onclick="window.location.href = 'main.html'">برگشت</button>
                <br>
                `;
            } else {
                localStorage.setItem(`Word location:${locationFolder} -g`, folderWords.join("\n"));
                contents.innerHTML = "";
            }
            let counter = 0;
            while (counter < folderWords.length) {
                let wordDiv = Object.assign(document.createElement("div"), {
                    className: "wordsAndFolders",
                    dir: "auto"
                });
                let thisWord = folderWords[counter];
                let onclickEditControl = `
                <button onclick="folderWords.splice(${counter}, 1); view()">حذف</button>
                <input placeholder="ویرایش" id="editWord">
                <button onclick="let word = document.getElementById('editWord').value; if (checkWord(word, 'editWord')) {folderWords[${counter}] = word; view()}">ثبت</button>
                <button onclick="localStorage.setItem('cache-g', '${thisWord}'); window.location.href = 'game.html'">باز کردن</button>
                `;
                wordDiv.onclick = function () {
                    deselectAll();
                    wordDiv.style.backgroundColor = "blue";
                    control.innerHTML = onclickEditControl;
                };
                wordDiv.ondblclick = function () {
                    localStorage.setItem("cache-g", thisWord);
                    window.location.href = "game.html";
                };
                contents.appendChild(wordDiv);
                wordDiv.appendChild(Object.assign(document.createElement("img"), { src: "Word.jpg" }));
                wordDiv.appendChild(Object.assign(document.createElement("p"), { innerHTML: thisWord }));
                counter++;
            }
            counter = 0;
            while (counter < folders.length) {
                let folderDiv = Object.assign(document.createElement("div"), {
                    className: "wordsAndFolders",
                    dir: "auto"
                });
                let thisFolder = folders[counter];
                let onclickEditControl = `
                <button onclick="localStorage.removeItem('Word location:${locationFolder + thisFolder} -g'); view()">حذف</button>
                <input placeholder="ویرایش" id="editFolderName">
                <button onclick="renameFolder('${thisFolder}', document.getElementById('editFolderName').value, 'editFolderName')">ثبت</button>
                <button onclick="deselectAll(); control.innerHTML = ''; openFolder('${thisFolder}')">باز کردن</button>
                `;
                folderDiv.onclick = function () {
                    deselectAll();
                    folderDiv.style.backgroundColor = "blue";
                    control.innerHTML = onclickEditControl;
                };
                folderDiv.ondblclick = function () {
                    control.innerHTML = "";
                    openFolder(thisFolder);
                };
                contents.appendChild(folderDiv);
                folderDiv.appendChild(Object.assign(document.createElement("img"), { src: "Folder.png" }));
                folderDiv.appendChild(Object.assign(document.createElement("p"), { innerHTML: thisFolder.slice(0, thisFolder.length - 1) }));
                counter++;
            }
            if (locationFolder == "/") {
                let folderKPF = Object.assign(document.createElement("div"), {
                    className: "wordsAndFolders",
                    dir: "auto"
                });
                folderKPF.onclick = function () {
                    deselectAll();
                    folderKPF.style.backgroundColor = "blue";
                    control.innerHTML = "";
                };
                folderKPF.ondblclick = function () {
                    openFolder("KPF");
                };
                folderKPF.appendChild(Object.assign(document.createElement("img"), { src: "FolderLock.png" }));
                folderKPF.appendChild(Object.assign(document.createElement("p"), { innerHTML: "کلمات پیش فرض" }));
                contents.appendChild(folderKPF);
            }
            if (contents.innerHTML == "") {
                contents.innerHTML = "<p>خالی است!</p>"
            }
            document.getElementById("folderName").innerText = locationFolder;
        }
        function newWord() {
            let word = document.getElementById("newWord").value;
            if (checkWord(word, "newWord")) {
                folderWords.push(document.getElementById("newWord").value);
                view();
            }
        }
        function newFolder() {
            let folder = document.getElementById("newfolder").value;
            if (checkFolderName(folder, "newfolder")) {
                localStorage.setItem(`Word location:${locationFolder + folder}/ -g`, "");
                view();
            }
        }
        function checkWord(word, SID) {
            if (word.length == 5 && word.includes("-") == false && folderWords.includes(word) == false) {
                return true;
            } else {
                CWT(SID, "shake");
                CWT("alert", "SBE");
                let alert = document.getElementById("alert");
                if (word.length != 5) {
                    alert.innerText = "کلمه 5 حرفی نیست.";
                } else if (word.includes("-")) {
                    alert.innerText = 'کلمه "-" دارد.';
                } else {
                    alert.innerText = "کلمه قبلا ذخیره شده.";
                }
                return false;
            }
        }
        function checkFolderName(folder, SID) {
            if (folder.includes("/") == false && folders.includes(folder) == false) {
                return true;
            } else {
                CWT(SID, "shake");
                CWT("alert", "SBE");
                let alert = document.getElementById("alert");
                if (folder.includes("/")) {
                    alert.innerText = 'پوشه "/" دارد.';
                } else {
                    alert.innerText = 'پوشه اینجا با این نام هست.';
                }
                return false;
            }
        }
        function openFolder(folder) {
            if (folder.includes("/")) {
                locationFolder = locationFolder + folder;
                folderWords = localStorage.getItem(`Word location:${locationFolder} -g`).split("\n").filter(word => word.length > 0);
            } else if (folder == "lastFolder") {
                let PFB = locationFolder.split("/");
                locationFolder = PFB.slice(0, PFB.length - 2).join("/") + "/";
                folderWords = localStorage.getItem(`Word location:${locationFolder} -g`).split("\n").filter(word => word.length > 0);
                if (document.body.querySelector("div").style.display == "none") {
                    document.body.querySelector("div").style.display = "block";
                }
            } else if (folder == "KPF") {
                locationFolder = "/کلمات پیش فرض/";
                folderWords = ["سلامت", "کوروش", "ناخدا", "چرا؟!", "وگرنه"];
            }
            if (locationFolder == "//") {
                locationFolder = "/";
            }
            view();
        }
        function renameFolder(LFN, folderName, SID) {
            if (checkFolderName(folderName, SID)) {
                if (locationFolder[locationFolder.length - 1] == "/") {
                    localStorage.setItem(`Word location:${locationFolder + folderName}/ -g`, localStorage.getItem(`Word location:${locationFolder + LFN} -g`));
                    localStorage.removeItem(`Word location:${locationFolder + LFN} -g`)
                } else {
                    localStorage.setItem(`Word location:${locationFolder}/${folderName}/ -g`, localStorage.getItem(`Word location:${locationFolder}/${LFN} -g`));
                    localStorage.removeItem(`Word location:${locationFolder}/${LFN} -g`)
                }
            }
            view();
        }
        function deselectAll() {
            document.querySelectorAll(".wordsAndFolders").forEach(function (wordOrFolder) {
                wordOrFolder.style.backgroundColor = "";
            });
        }
        function CRWTP() {
            let wordsNumber = folderWords.length;
            if (wordsNumber >= 2) {
                localStorage.setItem('cache-g', folderWords[random(wordsNumber - 1)]);
                window.location.href = "game.html";
            } else {
                CWT("alert", "SBE");
                document.getElementById("alert").innerText = "در بازی باید بیشتر از 2 کلمه باشد تا شما بازی با انتخاب رندوم کنید.";
            }
        }
        document.addEventListener("keydown", function (keydeselect) {
            let keydowned = keydeselect.key;
            if (keydowned == "d" || keydowned == "D" || keydowned == "ی") {
                deselectAll();
                document.getElementById("control").innerHTML = "";
            }
        });
    </script>
</body>

</html>
