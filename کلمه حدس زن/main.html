<!DOCTYPE html>
<html lang="fa" dir="auto">

Made by Kourosh Fathabadi-->

<head>
    <meta charset="UTF-8">
    <title>کلمه حدس زن</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="(hover: none) and (pointer: coarse)">
    <meta name="msvalidate.01" content="B760332CD52E9B592E375D808E6BBC21" />
    <style>
        .folder {
            cursor: pointer;
            display: inline-block;
            border-radius: 0px;
            margin: 1%;
        }

        .folder:hover {
            background-color: rgb(0, 100, 255);
        }

        .folder:active {
            background-color: rgb(0, 100, 255);
        }
    </style>
    <script src="kernel.js"></script>
    <script>
        if (localStorage.getItem("money-g") == null || localStorage.getItem("Word location:/ -g") == null || localStorage.getItem("startHour-g") == null || localStorage.getItem("day-g") == null) {
            localStorage.setItem("cache-g", "welcome");
            window.location.href = 'welcome.html';
        } else {
            localStorage.removeItem("cache-g");
        }
    </script>
</head>

<body>
    <img src="icon.png">
    <div class="line"></div>
    <h1>کلمه حدس زن</h1>
    <button onclick="localStorage.setItem('cache-g', 'WordMGR'); window.location.href = 'word mgr.html'" class="BM">مدیر کلمات داخلی</button>
    <button onclick="giveMoneyDay()" id="BMD" class="BM">پول روزانه</button>
    <button onclick="controlPanel()" class="BM">پنل کنترل</button>
    <h1>دسترسی سریع انتخاب رندوم:</h1>
    <div class="folder" onclick="localStorage.setItem('cache-g', KPF[random(KPF.length - 1)]); window.location.href = 'game.html'">
        <img src="word mgr/lock folder.png">
        <p>/کلمات پیش فرض/</p>
    </div>
    <script src="https://kourosh394.github.io/HTML-change-fast-files/کلمه%20حدس%20زن/versionDay.js"></script>
    <script>
        /*version:*/ const version = 3.6;
        let counter = 0;
        const folders = localStorages.filter(LSF => LSF.startsWith("Word location:"));
        while (counter < folders.length) {
            const folder = folders[counter];
            const folderLabel = folder.slice(14, -3);
            const folderDiv = document.createElement("div");
            folderDiv.className = "folder";
            let imgSrc = "word mgr/full folder.png";
            if (localStorage.getItem(folder) == "" && localStorages.filter(LSF => LSF.startsWith("Word location:/" + folderLabel)).length == 1) {
                imgSrc = "word mgr/empty folder.png";
            }
            folderDiv.appendChild(Object.assign(document.createElement("img"), { src: imgSrc }));
            folderDiv.appendChild(Object.assign(document.createElement("p"), { innerHTML: folderLabel }));
            folderDiv.onclick = function () {
                const words = localStorage.getItem(folder).split("\n");
                if (words.length >= 2) {
                    localStorage.setItem("cache-g", words[random(words.length - 1)]);
                    window.location.href = "game.html";
                } else {
                    message("در بازی باید بیشتر از 2 کلمه باشد تا شما بازی با انتخاب رندوم کنید.");
                }
            };
            document.body.appendChild(folderDiv);
            counter++;
        }
        moneyG();
        music();
        let startHour = Number(localStorage.getItem("startHour-g"));
        let dayILS = Number(localStorage.getItem("day-g"));
        let hour = new Date().getHours();
        let day = new Date().getDay();
        let getMoneyDay;
        if (navigator.onLine == true && fileVersion == true && window.versionDay > version) {
            message("نسخه ی جدید آمده است🥳. آیا دانلود شود؟", function () {
                window.location.href = downloadLink;
            });
        }
        if (dayILS < day && hour >= startHour) {
            document.getElementById("BMD").innerText = "پول روزانه همین الان";
            getMoneyDay = true;
        } else if (hour > startHour) {
            document.getElementById("BMD").innerText = `پول روزانه ${(startHour + 24) - hour} ساعت دیگر`;
        } else if (hour < startHour) {
            document.getElementById("BMD").innerText = `پول روزانه ${(hour + 24) - startHour} ساعت دیگر`;
        } else {
            document.getElementById("BMD").innerText = "پول روزانه 1 روز دیگر";
        }
        function giveMoneyDay() {
            if (getMoneyDay) {
                localStorage.setItem("cache-g", "giveMoneyDay");
                localStorage.setItem("day-g", day);
                window.location.href = 'giv mny day.html';
            } else {
                CWT("BMD", "shake");
                message("شما نمیتوانید پول روزانه  بگیرید.");
            }
        }
        function controlPanel() {
            localStorage.setItem("cache-g", "controlPanel");
            window.location.href = 'control.html';
        }
    </script>
</body>

</html>
